name: "dev-workspace"

services:
  nodejs:
    build:
      context: .
      dockerfile: node/Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION}
        YARN_VERSION: ${YARN_VERSION}
        NPM_VERSION: ${NPM_VERSION}
        BUN_VERSION: ${BUN_VERSION}
    container_name: nodejs
    entrypoint: ["/bin/sh"]
    init: true
    tty: true
    ports:
      - "3000:3000"
      - "4200:4200"
      - "3001:3001"
      - "5174:5174"
      - "${CHROME_DEBUG_PORT:-9222}:9222"
    volumes:
      - ${NODE_WORKSPACE}:/var/www
      - ~/.ssh:/home/node/.ssh:ro
      - cache_nodejs_npm:/home/node/.npm
      - cache_nodejs_yarn:/home/node/.yarn
      - cache_nodejs_bun:/home/node/.bun/install/cache
      - vscode_nodejs_data:/home/node/.vscode-server
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4g
    networks:
      - workspace-network

  mongo:
    image: mongo:${MONGO_VERSION}
    container_name: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "${MONGO_DB_PORT}:27017"
    volumes:
      - ${MONGO_DB_STORE}:/data/db
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2g
    networks:
      - workspace-network

  seaweedfs:
    image: chrislusf/seaweedfs:${SEAWEEDFS_VERSION}
    container_name: seaweedfs
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_S3_SECRET_KEY}
      AWS_REGION: ${SEAWEEDFS_S3_REGION}
    command: >
      server
      -dir=/data
      -ip=seaweedfs
      -ip.bind=0.0.0.0
      -filer
      -s3
      -master.volumeSizeLimitMB=1024
    ports:
      - "${SEAWEEDFS_MASTER_PORT}:9333"
      - "${SEAWEEDFS_VOLUME_PORT}:8080"
      - "${SEAWEEDFS_FILER_PORT}:8888"
      - "${SEAWEEDFS_S3_PORT}:8333"
    volumes:
      - ${SEAWEEDFS_DATA_STORE}:/data
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2g
    networks:
      - workspace-network

  chrome:
    image: chromedp/headless-shell:${CHROME_VERSION:-latest}
    container_name: chrome
    shm_size: "512mb"
    # Share the Node container network so localhost:5174 and localhost:3001
    # resolve exactly as they do in a developer's browser.
    network_mode: "service:nodejs"
    depends_on:
      - nodejs
    command:
      - --disable-dev-shm-usage
      - --remote-allow-origins=*
      - --hide-scrollbars
      - --window-size=1440,900

networks:
  workspace-network:

volumes:
  mongo_data:
  seaweedfs_data:
  cache_nodejs_npm:
  cache_nodejs_yarn:
  cache_nodejs_bun:
  vscode_nodejs_data:
